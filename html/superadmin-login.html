<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superadmin Login | StudioMitra</title>
    <!-- Bootstrap CSS -->
    <link href="assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e2a3b 0%, #2d3f58 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 900px;
        }

        .login-card {
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            display: flex;
            min-height: 500px;
            position: relative;
        }

        .login-left {
            background: url('images/portfolio4.png') center/cover no-repeat;
            width: 50%;
            position: relative;
            display: none;
        }

        @media (min-width: 768px) {
            .login-left {
                display: block;
            }
        }

        .login-left-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(30, 42, 59, 0.8) 0%, rgba(203, 111, 9, 0.6) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        .login-left-overlay img {
            width: 200px;
            margin-bottom: 30px;
            filter: brightness(0) invert(1);
            transition: transform 0.3s ease;
        }

        .login-left-overlay img:hover {
            transform: scale(1.05);
        }

        .login-left-overlay h2 {
            color: #fff;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .login-left-overlay p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
        }

        .login-right {
            width: 100%;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fff;
        }

        @media (min-width: 768px) {
            .login-right {
                width: 50%;
                padding: 50px 50px;
            }
        }

        .back-to-home {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #6c757d;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
            z-index: 10;
        }

        .back-to-home:hover {
            color: #cb6f09;
        }

        .login-title {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: #1e2a3b;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        .login-subtitle {
            color: #6c757d;
            margin-bottom: 35px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            font-weight: 600;
            color: #1e2a3b;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .input-group-text {
            background: #f8f9fa;
            border-right: none;
            color: #6c757d;
            border-color: #e9ecef;
        }

        .form-control {
            border-left: none;
            padding-left: 0;
            background: #f8f9fa;
            border-color: #e9ecef;
            padding: 12px 15px 12px 0;
        }

        .form-control:focus {
            box-shadow: none;
            background: #fff;
        }

        .input-group {
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            box-shadow: 0 0 0 0.25rem rgba(203, 111, 9, 0.15);
        }

        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control,
        .input-group:focus-within .btn-outline-secondary {
            border-color: #cb6f09;
            background: #fff;
            color: #1e2a3b;
        }

        .btn-outline-secondary {
            background: #f8f9fa;
            border-color: #e9ecef;
            color: #6c757d;
        }

        .btn-outline-secondary:hover {
            background: #f8f9fa;
            color: #1e2a3b;
        }

        .btn-login {
            background: linear-gradient(135deg, #cb6f09, #aa4502);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(203, 111, 9, 0.2);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(203, 111, 9, 0.3);
            color: #fff;
        }

        .forgot-link {
            color: #cb6f09;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .forgot-link:hover {
            color: #aa4502;
            text-decoration: underline;
        }

        .form-check-input:checked {
            background-color: #cb6f09;
            border-color: #cb6f09;
        }

        .copyright-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 20px;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card">
            <a href="index.html" class="back-to-home d-md-none"><i class="fa-solid fa-arrow-left me-1"></i> Home</a>
            <div class="login-left">
                <div class="login-left-overlay">
                    <a href="index.html">
                        <img src="assets/logo1.png" alt="StudioMitra Logo">
                    </a>
                    <h2>Superadmin Portal</h2>
                    <p>Manage studios, clients, and platform wide settings seamlessly.</p>
                </div>
            </div>
            <div class="login-right">
                <a href="index.html" class="back-to-home d-none d-md-block"><i class="fa-solid fa-arrow-left me-1"></i>
                    Back to Home</a>

                <h1 class="login-title">Welcome Back</h1>
                <p class="login-subtitle">Sign in to access the superadmin dashboard</p>

                <form action="superadmin-dashboard.html" method="GET">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                            <input type="email" class="form-control" placeholder="admin@studiomitra.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label class="form-label mb-0">Password</label>
                            <a href="#" class="forgot-link">Forgot Password?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="Enter your password"
                                required>
                            <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePassword">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-check mb-2 mt-3">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label text-muted" style="font-size: 0.95rem;" for="rememberMe">
                            Remember me for 30 days
                        </label>
                    </div>

                    <button type="submit" class="btn btn-login">
                        Sign In <i class="fa-solid fa-arrow-right-to-bracket ms-1"></i>
                    </button>
                </form>
            </div>
        </div>
        <div class="copyright-text">
            &copy; 2025 StudioMitra. All Rights Reserved.
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle Password Visibility
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePasswordBtn.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            const icon = this.querySelector('i');
            if (type === 'text') {
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
    </script>
</body>

</html>
